<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20252b;background:#f7f8fa;font-size:15px;letter-spacing:0;color-scheme:light}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid #ccd2d9;background:white;color:#20252b;padding:9px 14px;border-radius:6px;font-weight:600}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #168477;outline-offset:3px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dde1e6}header .inner{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px}.brand{font-size:18px;font-weight:750}.brand b{color:#c32a3a}.top-actions{display:flex;gap:8px;align-items:center}.mode{font-size:12px;font-weight:700;border-left:3px solid #168477;padding-left:8px}.icon{width:44px;height:44px;padding:0;font-size:23px}.settings{font-size:19px}
main{max-width:1080px;margin:auto;padding:24px 20px 108px}.page[hidden]{display:none}h1{font-size:25px;margin:0 0 8px;line-height:1.2}h2{font-size:18px;margin:0 0 16px}h3{font-size:16px;line-height:1.4;margin:0 0 8px}p{line-height:1.5;margin:8px 0}.muted{color:#67717d}.small{font-size:12px}.section{padding:24px 0;border-top:1px solid #dce1e6;margin-top:24px}.status-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dot{width:8px;height:8px;background:#168477;border-radius:50%;display:inline-block;flex-shrink:0}.dot.bad{background:#c32a3a}.status-title{font-weight:700}.tag{font-size:12px;font-weight:650;padding:4px 8px;border-radius:4px;background:#e8edf1;color:#4a5561;display:inline-block}.tag.green{background:#e0f1ed;color:#116b5b}.tag.red{background:#fae7e8;color:#ad2532}.tag.amber{background:#fff0d5;color:#895707}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:24px 0;border-top:1px solid #dce1e6;border-bottom:1px solid #dce1e6}.metric{padding:18px 16px;border-right:1px solid #dce1e6;min-width:0}.metric:first-child{padding-left:0}.metric:last-child{border:0}.metric span{display:block;color:#67717d;font-size:13px}.metric strong{display:block;font-size:24px;margin:6px 0;overflow-wrap:anywhere}.negative{color:#b12838}.positive{color:#116b5b}.metric small{color:#67717d;font-size:12px}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:32px}.row{padding:12px 0;border-bottom:1px solid #e1e5e9;display:flex;justify-content:space-between;gap:16px;align-items:baseline}.row>span:last-child{text-align:right}.row strong{overflow-wrap:anywhere}.primary{background:#166f63;border-color:#166f63;color:white}.danger{color:#b12838}.text-button{border:0;background:transparent;padding:8px;color:#126e63}.section-title{display:flex;justify-content:space-between;align-items:center;gap:16px}.card{background:white;border:1px solid #d6dce2;border-radius:8px;padding:20px;margin:12px 0}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.card-head h3{flex:1}.proposal{font-weight:650;margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions button{flex-grow:1}.evidence-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px 0;border-top:1px solid #e1e5e9;border-bottom:1px solid #e1e5e9;margin:14px 0}.evidence-grid span{display:block;font-size:12px;color:#67717d}.evidence-grid strong{font-size:17px;display:block;margin-top:4px;overflow-wrap:anywhere}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;padding:12px 0;font-weight:600;list-style:none}summary::before{content:'+';font-size:20px;color:#67717d}details[open]>summary::before{content:'-'}details{border-top:1px solid #dce1e6}.detail-copy{font-size:14px;color:#46515c}.detail-copy .row{align-items:flex-start}.detail-copy .row>span{flex:1}.empty{padding:28px 0;color:#67717d}.empty strong{color:#20252b;display:block;margin-bottom:6px}.notice{padding:12px 16px;border-left:3px solid #ab6b0b;background:#fff4df;margin:16px 0;line-height:1.5}.notice.error{border-color:#c32a3a;background:#fae9eb}.notice[hidden]{display:none}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:white;border-top:1px solid #dce1e6;padding-bottom:env(safe-area-inset-bottom)}nav .inner{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:1080px;margin:auto}nav button{border:0;border-top:3px solid transparent;border-radius:0;font-size:14px;min-height:60px;background:white;padding:12px 6px}nav button.active{border-color:#166f63;background:#edf5f2;color:#116b5b}.counter{font-size:12px;margin-left:4px}table{border-collapse:collapse;width:100%;font-size:14px}th{font-size:12px;text-align:left;color:#67717d;font-weight:600;padding:12px 8px}td{border-top:1px solid #e1e5e9;padding:14px 8px;vertical-align:top}td:last-child,th:last-child{text-align:right}.nowrap{white-space:nowrap}tbody tr:hover{background:#f0f3f6}.table-wrap{overflow-x:auto}.filters{display:flex;gap:8px;margin:16px 0}.filters button[aria-pressed=true]{background:#e0f1ed;border-color:#168477;color:#116b5b}dialog{border:1px solid #ccd2d9;border-radius:8px;padding:24px;width:min(480px,calc(100% - 32px));max-height:85vh;overflow-y:auto;color:#20252b}dialog::backdrop{background:#20252b70}dialog h2{margin:0 0 12px}label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}input,textarea{width:100%;border:1px solid #bcc5ce;border-radius:4px;padding:10px;min-height:44px}textarea{resize:vertical}#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#20252b;color:white;max-width:calc(100% - 32px);padding:12px 16px;border-radius:6px;z-index:10;line-height:1.4}#toast:empty{display:none}a{color:#126e63}.chart{display:flex;align-items:center;gap:12px;margin:12px 0}.bar{height:8px;background:#e1e5e9;flex:1;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#168477}button,.tag,p,span,h1,h2,h3{overflow-wrap:anywhere}
@media(max-width:640px){header .inner{padding:10px 16px}.mode{max-width:65px}main{padding:20px 16px 104px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:16px 12px!important}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid #dce1e6}.metric strong{font-size:22px}.two-cols{grid-template-columns:1fr;gap:24px}.card{padding:16px}.card-head{flex-wrap:wrap}.evidence-grid{gap:8px}.evidence-grid strong{font-size:16px}h1{font-size:23px}.desktop-only{display:none}.row{gap:10px}.brand{font-size:17px}}
.mode{white-space:nowrap;flex-shrink:0}
.icon svg{width:20px;height:20px;vertical-align:middle}
</style>
</head>
<body>
<header><div class="inner"><div class="brand"><b>Red</b> Bot <span class="muted">Operator</span></div><div class="top-actions"><span class="mode" id="mode">Verbinden</span><button class="icon" id="refresh" title="Verversen" aria-label="Verversen"><!-- @license lucide-static v0.468.0 - ISC --> <svg aria-hidden="true"   class="lucide lucide-refresh-cw"   xmlns="http://www.w3.org/2000/svg"   width="24"   height="24"   viewBox="0 0 24 24"   fill="none"   stroke="currentColor"   stroke-width="2"   stroke-linecap="round"   stroke-linejoin="round" >   <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />   <path d="M21 3v5h-5" />   <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />   <path d="M8 16H3v5" /> </svg> </button><button class="icon settings" id="settings" title="Toegang instellen" aria-label="Toegang instellen"><!-- @license lucide-static v0.468.0 - ISC --> <svg aria-hidden="true"   class="lucide lucide-settings"   xmlns="http://www.w3.org/2000/svg"   width="24"   height="24"   viewBox="0 0 24 24"   fill="none"   stroke="currentColor"   stroke-width="2"   stroke-linecap="round"   stroke-linejoin="round" >   <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />   <circle cx="12" cy="12" r="3" /> </svg> </button></div></div></header>
<main><div id="error" class="notice error" role="alert" hidden></div><div id="freshness" class="notice" hidden></div><div id="loading" class="empty" role="status">Gegevens ophalen...</div><div class="page" id="overview"></div><div class="page" id="decisions" hidden></div><div class="page" id="experiments" hidden></div><div class="page" id="positions" hidden></div></main>
<nav aria-label="Hoofdnavigatie"><div class="inner"><button data-page="overview" class="active" aria-current="page">Overzicht</button><button data-page="decisions">Besluiten <span id="decision-count" class="counter"></span></button><button data-page="experiments">Tests</button><button data-page="positions">Posities</button></div></nav>
<dialog id="access"><h2>Operator-toegang</h2><form id="access-form"><label for="token">Operator-token</label><input id="token" type="password" autocomplete="off"><div class="actions"><button type="button" data-close="access">Sluiten</button><button class="primary" type="submit">Opslaan</button></div></form></dialog>
<dialog id="confirm"><h2 id="confirm-title">Besluit</h2><p id="confirm-change"></p><p id="confirm-effect" class="notice"></p><form id="decision-form"><label for="note">Notitie (optioneel)</label><textarea id="note" rows="2" maxlength="2000"></textarea><div id="decision-error" class="notice error" role="alert" hidden></div><div class="actions"><button type="button" data-close="confirm">Annuleren</button><button type="submit" class="primary" id="confirm-submit">Bevestigen</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
let data=null, loading=false, page='overview', positionFilter='all', selected=null, toastTimer;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=(v,d=2)=>v===null||v===undefined||!Number.isFinite(Number(v))?'—':Number(v).toLocaleString('nl-NL',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=v=>v===null||v===undefined?'—':new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(Number(v));
const sign=v=>Number(v)<0?'negative':Number(v)>0?'positive':'';
const date=v=>v?new Date(typeof v==='number'?v: v).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Onbekend';
const metric=(label,value,sub='',kind='')=>`<div class="metric"><span>${esc(label)}</span><strong class="${kind}">${esc(value)}</strong><small>${esc(sub)}</small></div>`;
const row=(label,value)=>`<div class="row"><span class="muted">${esc(label)}</span><span>${esc(value??'Onbekend')}</span></div>`;
const empty=(title,copy)=>`<div class="empty"><strong>${esc(title)}</strong>${esc(copy)}</div>`;
const statusNames={needs_operator_review:'Jouw besluit',approved_pending_live_gate:'Wacht op live-gate',wait_more_evidence:'Meer bewijs nodig',blocked:'Geblokkeerd',auto_accept_as_context:'Context bijgewerkt',approved_shadow:'Shadow goedgekeurd',COLLECTING:'Bewijs verzamelen',NO_EVENTS:'Nog geen meetpunten',READY_FOR_REVIEW:'Resultaat beoordelen',READY_FOR_PROMOTION_REVIEW:'Minder verlies / betere uitkomst',STOP_PAPER:'Test stoppen',INCONCLUSIVE:'Geen duidelijk voordeel',COLLECT_MORE:'Meer bewijs nodig'};
const label=s=>statusNames[s]||s||'Onbekend';
function show(name){page=name;for(const el of document.querySelectorAll('.page'))el.hidden=el.id!==name;for(const b of document.querySelectorAll('nav button')){b.classList.toggle('active',b.dataset.page===name);if(b.dataset.page===name)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}window.scrollTo(0,0);}
function toast(text){$('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',6500);}
async function get(path,options={}){const res=await fetch(path,{...options,signal:AbortSignal.timeout(20000)});const result=await res.json();if(!res.ok)throw new Error(res.status===401?'Operator-token ontbreekt of is onjuist.':String(result.detail||`Verzoek mislukt (${res.status})`));return result;}
async function load(){if(loading)return;loading=true;$('refresh').disabled=true;try{const next=await get('/api/mobile?limit=40');data=next;render();$('error').hidden=true;$('loading').hidden=true;}catch(error){$('error').textContent=`Geen verbinding: ${error.message}${data?' Laatst opgehaalde gegevens blijven zichtbaar.':''}`;$('error').hidden=false;}finally{loading=false;$('refresh').disabled=false;}}
function render(){
 const c={...(data.cockpit||{}),created_utc:data.snapshot?.created_utc||data.cockpit?.created_utc||data.adaptive_restriction_outcomes?.created_utc},risk=c.risk||{},learning=c.learning||{},s=data.safety||{},ex=data.exits?.summary||{},r=data.recommendations?.items||[],out=data.adaptive_restriction_outcomes?.summary||{};
 const decisions=r.filter(x=>x.status==='needs_operator_review');
 $('mode').textContent=data.trading_mode==='dryrun'?'Paper':data.trading_mode==='auto'?'Live':'Modus onbekend';
 $('decision-count').textContent=decisions.length?`(${decisions.length})`:'';
 const age=c.created_utc?(Date.now()-new Date(c.created_utc).getTime())/60000:Infinity;
 const warnings=[...(data.warnings||[]).map(x=>`Rapport ontbreekt: ${x}`)];if(data.preview)warnings.unshift('Preview: besluiten worden niet op de Pi opgeslagen.');if(age>90)warnings.push('De analyse is ouder dan 90 minuten.');if(data.positions?.status==='ERROR')warnings.push('Positiegegevens kunnen niet worden gelezen.');
 $('freshness').textContent=warnings.join(' ');$('freshness').hidden=!warnings.length;
 const safe=s.status==='OK'&&!s.kill_switch_active&&!s.meltdown?.active;
 const net=ex.total_realized_pnl_eur??risk.exit_total_pnl_eur;
 $('overview').innerHTML=`<div class="status-line"><span class="dot ${safe?'':'bad'}"></span><span class="status-title">${safe?'Veiligheidscontrole OK':'Aandacht nodig'}</span><span class="tag">${decisions.length} besluit${decisions.length===1?'':'en'}</span></div><h1 style="margin-top:16px">Handelen &amp; leren</h1><p class="muted small">Analyse ${esc(date(c.created_utc))} · Opgehaald ${esc(date(data.generated_utc))}</p><div class="metrics">${metric('Netto gerealiseerd',eur(net),'Inclusief openings- en sluitingskosten',sign(net))}${metric('Gesloten posities',ex.closed_positions??risk.exit_closed,'Volledige historie')}${metric('Winrate',`${number(ex.win_rate_pct??risk.exit_win_rate_pct)}%`,'Na handelskosten')}${metric('Actieve tests',data.adaptive_restrictions?.summary?.active_restrictions??0,`${out.labeled_events??0} gelabelde meetpunten`)}</div><div class="two-cols"><div><h2>Vandaag</h2>${decisions.length?`<p>${decisions.length} voorstel wacht op jouw beoordeling.</p><button class="primary" data-go="decisions">Besluiten bekijken</button>`:empty('Geen nieuw besluit nodig','De bestaande tests blijven gevolgd worden.')}${row('Open posities',risk.lifecycle_open??'Onbekend')}${row('Marktomstandigheden',({risk_off:'Defensief',risk_on:'Risicobereid',mixed:'Gemengd',chop:'Zijwaarts'})[learning.market_regime]||learning.market_regime)}${row('Botgezondheid',c.bot_health?.status||'Onbekend')}</div><div><h2>Learning</h2>${row('Gemeten voordeel van tests',`${number(out.delta_r,4)} R`)}${row('Resultaten voor beoordeling',out.ready_for_review??0)}${row('ML onderscheidend vermogen',learning.ml_auc===undefined?'Onbekend':`AUC ${number(learning.ml_auc,3)}`)}<p class="muted small">Positief verschil betekent beter dan de baseline, ook als beide verliesgevend zijn.</p><button data-go="experiments">Tests bekijken</button></div></div><div class="section"><details><summary>Veiligheid &amp; beperkingen</summary>${row('Nieuwe entries',s.live_entry_orders_allowed?'Toegestaan':'Geblokkeerd')}${row('Kill switch',s.kill_switch_active?'Actief':'Niet actief')}${row('Meltdown',s.meltdown?.active?'Actief':'Niet actief')}${row('Live wijzigingen',s.live_enforcement_allowed?'Gate toegestaan':'Gate gesloten')}${row('Actuele blokkade',c.bot_health?.blockers??0)}${row('Daglimiet / guards',risk.guard_primary_issue||'Onbekend')}</details></div>`;
 $('decisions').innerHTML=`<h1>Jouw besluiten</h1><p class="muted">${decisions.length} voorstel${decisions.length===1?'':'len'} om te beoordelen</p>${decisions.length?decisions.map(item=>decisionCard(item)).join(''):empty('Alles beoordeeld','Nieuwe voorstellen verschijnen zodra er voldoende bewijs is.')}<div class="section"><details><summary>Wachtend, verwerkt en geblokkeerd (${r.length-decisions.length})</summary>${r.filter(x=>x.status!=='needs_operator_review').map(i=>`<div class="row"><span><strong>${esc(i.operator_title||i.title)}</strong><br><span class="small muted">${esc(i.operator_summary||'')}</span></span><span class="tag">${esc(label(i.status))}</span></div>`).join('')||empty('Geen overige voorstellen','')}</details><details><summary>Recente besluiten</summary>${(data.operator_decisions?.recent||[]).map(i=>row(date(i.created_utc),({approve:'Goedgekeurd',reject:'Afgewezen',wait:'Meer bewijs',freeze:'Geparkeerd',note:'Notitie'})[i.action]||i.action)).join('')||empty('Nog geen besluiten','')}</details></div>`;
 renderTests();renderPositions();
}
function decisionCard(item){const evidence=(item.operator_evidence||[]).slice(0,14);const allowed=new Set(item.allowed_actions_v1||[]);const actions=(item.operator_actions?.length?item.operator_actions:[{id:'approve',label:'Akkoord'},{id:'wait',label:'Meer bewijs'},{id:'reject',label:'Afwijzen'},{id:'freeze',label:'Parkeren'}]).filter(a=>allowed.has(a.id)&&['approve','wait','reject','freeze'].includes(a.id));return `<article class="card"><div class="card-head"><h3>${esc(item.operator_title||item.title)}</h3><span class="tag amber">Jouw besluit</span></div><p class="proposal">${esc(item.proposed_change||item.operator_summary)}</p><p>${esc(item.operator_question||item.learning_question)}</p><p class="small muted">${esc(item.operator_consequence||'Je besluit wordt vastgelegd voor de volgende fase.')}</p><details><summary>Bewijs &amp; testplan</summary><div class="detail-copy"><p>${esc(item.test_plan)}</p>${evidence.map(e=>row(e.label,e.value)).join('')}${row('Volgende fase',item.target_phase)}${row('Komt terug als',item.returns_as)}</div></details><div class="actions">${actions.map(a=>`<button class="${a.id==='approve'?'primary':a.id==='reject'?'danger':''}" data-item="${esc(item.id)}" data-action="${esc(a.id)}">${esc(a.label)}</button>`).join('')}</div></article>`;}
function renderTests(){const rows=[...(data.adaptive_restriction_outcomes?.restrictions||[])].sort((a,b)=>(b.labeled_events||0)-(a.labeled_events||0));const active=new Map((data.adaptive_restrictions?.restrictions||[]).map(r=>[r.restriction_id,r]));$('experiments').innerHTML=`<h1>Lopende tests</h1><p class="muted">Baseline en kandidaat op dezelfde signalen · ${data.adaptive_restriction_outcomes?.summary?.cost_basis?'netto na handelskosten':'kostenbasis nog niet bijgewerkt'}</p>${rows.length?rows.map(r=>{const restriction=active.get(r.restriction_id)||{};const better=Number(r.delta_R)>0;return `<article class="card"><div class="card-head"><h3>${esc(r.symbol||'Entrycluster')} · ${r.state==='reduced_risk'?'lager risico':'entryregel'}</h3><span class="tag ${r.conclusion==='STOP_PAPER'?'red':r.labeled_events>=10?'green':''}">${esc(label(r.conclusion||r.status))}</span></div><div class="evidence-grid"><div><span>Baseline</span><strong class="${sign(r.baseline_R)}">${number(r.baseline_R,4)} R</strong></div><div><span>Kandidaat</span><strong class="${sign(r.candidate_R)}">${number(r.candidate_R,4)} R</strong></div><div><span>Verschil</span><strong class="${sign(r.delta_R)}">${better?'+':''}${number(r.delta_R,4)} R</strong></div></div><p class="small muted">${r.labeled_events??0} gelabeld · ${r.pending_events??0} wachtend · ${r.applied_events??0} toegepast</p>${r.baseline_R<0&&r.candidate_R<0?'<p class="notice">Beide varianten zijn verliesgevend. Een positief verschil betekent hier minder verlies.</p>':''}${r.status==='NO_EVENTS'?'<p class="notice">Nog geen signalen gemeten waarop deze regel is toegepast.</p>':''}<details><summary>Regel, evaluatie &amp; heropening</summary>${row('Regel',r.rule_id)}${row('Sizingfactor',restriction.risk_multiplier)}${row('Reviewmoment',r.review_after)}<div class="detail-copy">${(r.reopen_criteria||[]).map(x=>`<p>${esc(x)}</p>`).join('')}</div></details></article>`}).join(''):empty('Nog geen actieve test','Goedgekeurde en toepasbare voorstellen verschijnen hier.')}`;}
function renderPositions(){const rows=data.positions?.rows||[];const filtered=rows.filter(r=>positionFilter==='all'||(positionFilter==='open'?r.status!=='closed':r.status==='closed'));$('positions').innerHTML=`<h1>Posities</h1><div class="filters"><button data-filter="all" aria-pressed="${positionFilter==='all'}">Recent</button><button data-filter="open" aria-pressed="${positionFilter==='open'}">Open</button><button data-filter="closed" aria-pressed="${positionFilter==='closed'}">Gesloten</button></div>${data.positions?.status==='ERROR'?'<div class="notice error">Posities konden niet worden gelezen.</div>':''}${filtered.length?`<div class="table-wrap"><table><thead><tr><th>Coin / richting</th><th>Status</th><th class="desktop-only">Moment</th><th>Netto gerealiseerd</th></tr></thead><tbody>${filtered.map(p=>`<tr><td><strong>${esc(p.symbol)}</strong><br><span class="small muted">${p.position_type==='short'?'Short':'Long'}</span></td><td>${p.status==='closed'?'Gesloten':p.status==='partial'?'Deels open':'Open'}<br><span class="small muted">${esc(({stop_loss:'Stop-loss',trailing_stop:'Trailing stop',tp1:'TP1',timestopbreakeven:'Tijdslimiet'})[p.exit_reason]||p.exit_reason||'')}</span></td><td class="desktop-only">${esc(date(p.close_ts||p.timestamp))}</td><td class="nowrap ${sign(p.pnl_eur)}">${eur(p.pnl_eur)}<br><span class="small muted">Kosten ${eur(p.fees_eur)}</span></td></tr>`).join('')}</tbody></table></div>`:empty('Geen posities in deze selectie','')}<p class="small muted">Netto gerealiseerd bevat handelskosten. Open koersresultaat is niet inbegrepen.</p>`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)show(b.dataset.page);if(b.dataset.go)show(b.dataset.go);if(b.dataset.filter){positionFilter=b.dataset.filter;renderPositions();}if(b.dataset.close)$(b.dataset.close).close();if(b.dataset.item){selected={item:data.recommendations.items.find(i=>i.id===b.dataset.item),action:b.dataset.action};if(!selected.item)return;$('confirm-title').textContent=b.textContent;$('confirm-change').textContent=selected.item.operator_title||selected.item.title;$('confirm-effect').textContent=({wait:'Het voorstel blijft wachten op meer bewijs.',reject:'Je wijst dit voorstel af.',freeze:'Je parkeert dit voorstel voor operatorreview.'})[selected.action]||selected.item.operator_consequence||'Je keuze wordt vastgelegd voor dit voorstel.';$('note').value='';$('decision-error').hidden=true;$('confirm').showModal();}});
$('refresh').onclick=load;$('settings').onclick=()=>{$('token').value=sessionStorage.getItem('operator-token')||'';$('access').showModal();};
$('access-form').onsubmit=e=>{e.preventDefault();sessionStorage.setItem('operator-token',$('token').value.trim());$('access').close();toast('Toegang opgeslagen voor deze sessie.');};
$('decision-form').onsubmit=async e=>{e.preventDefault();if(!selected)return;const button=$('confirm-submit');button.disabled=true;try{const token=sessionStorage.getItem('operator-token')||'';await get('/api/decisions',{method:'POST',headers:{'Content-Type':'application/json',...(token?{'X-Operator-Token':token}:{})},body:JSON.stringify({source_id:selected.item.id,source_type:'recommendation',action:selected.action,reason:$('note').value,scope:'recommendation',source_path:selected.item.source_path||'analysis/recommendations/latest_recommendation_aggregator.json'})});$('confirm').close();toast('Besluit opgeslagen.');await load();}catch(error){$('decision-error').textContent=error.message;$('decision-error').hidden=false;}finally{button.disabled=false;}};
load();setInterval(()=>{if(!document.hidden&&!$('confirm').open&&!$('access').open)load();},60000);
</script>
</body>
</html>
